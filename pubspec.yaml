name: face_detection_app
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.17.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  camera_android: ^0.10.10+1
  google_mlkit_face_detection: any
  google_mlkit_commons: any
  share_plus: ^10.0.0  # For sharing
  print_bluetooth_thermal: ^1.1.3  # Latest as of now
  esc_pos_utils_plus: ^2.0.2       # Updated fork for image support
  image: ^4.7.2  # For image decoding/processing
  permission_handler: ^11.3.1  # For requesting Bluetooth/location permissions

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/hat.png
    - assets/beard.png
    - assets/eye_patch.png
    - assets/xmas_cap.png
    - assets/no_filter.png
    